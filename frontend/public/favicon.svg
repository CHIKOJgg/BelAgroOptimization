  <path d="M16 18 H26 M38 18 H48" stroke="#34d399" stroke-width="1.5" stroke-dasharray="2 2" opacity="0.5" />
  
  <!-- Stylized Sprout / Data Nodes Motif -->
  <path d="M32 46 V22" stroke="#34d399" stroke-width="3" stroke-linecap="round" />
  <path d="M32 34 C38 34 44 28 44 22 C38 22 34 26 32 30" fill="url(#leafGrad)" stroke="#6ee7b7" stroke-width="1.2" stroke-linejoin="round" />
  <path d="M32 28 C26 28 20 22 20 16 C26 16 30 20 32 24" fill="url(#accentGrad)" stroke="#a7f3d0" stroke-width="1.2" stroke-linejoin="round" />
  
  <!-- Small Base Soil / Foundation Bar -->
  <rect x="24" y="47" width="16" height="3" rx="1.5" fill="#10b981" />
  <rect x="20" y="52" width="24" height="2.5" rx="1.25" fill="#059669" opacity="0.8" />
